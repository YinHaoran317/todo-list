<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日常 · 待办清单</title><meta name="description" content="一份简单、专注的待办清单。任务仅保存在当前浏览器。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232758ec'/%3E%3Cpath d='m8 16 5 5 11-11' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
</head>
<body>
<header class="topbar"><a class="brand" href="./"><span class="logo">✓</span>日常<span class="brand-en">DAILY</span></a><span class="top-note">给每一天，留一点秩序。</span></header>
<main>
<div class="eyebrow"><span></span> MY DAILY SPACE <span class="line"></span></div>
<section class="heading"><div><p id="date"></p><h1>待办清单<span class="title-dot">.</span></h1><p class="subtitle">把想做的事写下来，一件一件完成。</p></div><div class="progress-ring" id="ring"><span id="percent">0%</span><small>完成进度</small></div></section>
<section class="workspace" aria-label="待办事项">
<form id="add-form"><span class="input-plus" aria-hidden="true">＋</span><input id="task-input" aria-label="新任务" placeholder="接下来，想完成什么？" maxlength="200" autocomplete="off" required><button class="add-button" type="submit">添加任务 <span aria-hidden="true">↵</span></button></form>
<div class="toolbar"><div class="filters" aria-label="筛选任务"><button data-filter="all" aria-pressed="true">全部 <span id="all-count">0</span></button><button data-filter="active" aria-pressed="false">待完成 <span id="active-count">0</span></button><button data-filter="done" aria-pressed="false">已完成 <span id="done-count">0</span></button></div><button id="clear" class="clear">清除已完成</button></div>
<ul id="tasks"></ul>
<div id="empty"><div class="empty-mark">✓</div><h2 id="empty-title">从一件小事开始</h2><p id="empty-description">添加你的第一项待办，让今天更有方向。</p></div>
<div class="list-footer"><span><strong id="remaining">0</strong> 项待办，按自己的节奏来</span><span class="save-status" id="save-status">自动保存到此浏览器</span></div>
</section>
<div class="bottom-note"><span>一点点行动，也是在向前。</span><span>MAKE ROOM FOR WHAT MATTERS</span></div>
<p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
</main><footer>日常 <span>／</span> 少一点纷杂，多一点专注。</footer>
</body></html>
